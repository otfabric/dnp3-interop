name: Release
run-name: "Release ${{ inputs.bump && format('({0}) from {1}', inputs.bump, github.ref_name) || github.ref_name }}"

# Tag push: publish that tag. Manual run: bump the latest vX.Y.Z tag (patch by
# default) and publish that from main; the git tag is created with the GitHub
# release, its last step, so a failed run leaves no tag behind.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io/otfabric
  # Nothing is pulled from Docker Hub: anonymous pulls are rate limited per
  # runner address and its token service times out under load. Base images
  # (pinned by digest) and build tooling come from Google's mirror of it, and
  # every registry operation is retried on transient failures (scripts/retry.sh).
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

jobs:
  # The tag to release. Fails before anything is built when the commit is not
  # ready for it: versions.yaml and RELEASE.md must already name that version.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "::error::Releases are only allowed from ${DEFAULT_BRANCH}, not ${REF_NAME}"
              exit 1
            fi
            tag="$(scripts/next-version.sh "${BUMP}")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
          else
            tag="${REF_NAME}"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${tag} is not vX.Y.Z"; exit 1; }
          grep -qF "interop_version: \"${tag#v}\"" versions.yaml \
            || { echo "::error::versions.yaml does not say interop_version: \"${tag#v}\""; exit 1; }
          scripts/release-notes.sh "${tag}" > /dev/null \
            || { echo "::error::RELEASE.md has no notes for ${tag}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (from ${EVENT_NAME})"

  # One job per architecture on a runner of that architecture: every image is
  # built natively and self-tested, and exactly those of the published
  # adapters are pushed, as <image>:<version>-<arch>. The stepfunc image is
  # built and tested here but never pushed: the licence of the Step Function
  # I/O dnp3 crate forbids distributing it (Makefile, PUBLISHED_ADAPTERS).
  build:
    name: Build, test, push (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Validate
        run: |
          scripts/check-versions.sh
          python3 scripts/validate-fixtures.py --require-schema
          want="interop_version: \"${VERSION#v}\""
          grep -qF "$want" versions.yaml || { echo "::error::versions.yaml does not say $want"; exit 1; }
          # The notes of this version become the body of the GitHub release.
          scripts/release-notes.sh "${VERSION}" > /dev/null || { echo "::error::RELEASE.md has no notes for ${VERSION}"; exit 1; }

      - name: Build for linux/${{ matrix.arch }} and self-test
        run: |
          make -j4 --output-sync=target images
          make documents

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" > "${RUNNER_TEMP}/ghcr-token"
          scripts/retry.sh scripts/ghcr-login.sh "${{ github.actor }}" "${RUNNER_TEMP}/ghcr-token"
          rm -f "${RUNNER_TEMP}/ghcr-token"

      - name: Push the tested images of the published adapters as ${{ needs.version.outputs.tag }}-${{ matrix.arch }}
        run: make publish-arch ARCH=${{ matrix.arch }}

  # Joins the per-architecture images into the multi-arch tag and publishes
  # the release. Nothing is built here.
  release:
    name: Multi-arch manifest and release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [version, build]
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" > "${RUNNER_TEMP}/ghcr-token"
          scripts/retry.sh scripts/ghcr-login.sh "${{ github.actor }}" "${RUNNER_TEMP}/ghcr-token"
          rm -f "${RUNNER_TEMP}/ghcr-token"

      - name: Create ${{ needs.version.outputs.tag }} from the amd64 and arm64 images
        run: make publish-manifest

      - name: Digests of the multi-arch images
        id: digests
        run: |
          make -s digests | tee digests.txt
          while read -r adapter digest; do
            [[ "${digest}" == sha256:* ]] || { echo "::error::no digest for ${adapter}"; exit 1; }
            echo "${adapter}=${digest}" >> "$GITHUB_OUTPUT"
          done < digests.txt

      - name: Write manifest.json
        run: |
          arg() { sed -nE "s/^ARG $2=(.*)$/\1/p" "$1" | head -1; }
          jq -n \
            --arg version "${VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            --arg contract "$(sed -nE 's/^contract_version: "([^"]+)".*/\1/p' versions.yaml)" \
            --arg fixture "$(sed -nE 's/^fixture_schema: "([^"]+)".*/\1/p' versions.yaml)" \
            --arg odnp3_version "$(arg adapters/opendnp3/Dockerfile UPSTREAM_VERSION)" \
            --arg odnp3_sha "$(arg adapters/opendnp3/Dockerfile UPSTREAM_SHA)" \
            --arg sf_version "$(arg adapters/stepfunc/Dockerfile UPSTREAM_VERSION)" \
            --arg sf_sha "$(arg adapters/stepfunc/Dockerfile UPSTREAM_SHA)" \
            --arg opendnp3_digest "${{ steps.digests.outputs.opendnp3 }}" \
            --arg godnp3_version "$(arg adapters/dscsystems/Dockerfile UPSTREAM_VERSION)" \
            --arg godnp3_sha "$(arg adapters/dscsystems/Dockerfile UPSTREAM_SHA)" \
            --arg dscsystems_digest "${{ steps.digests.outputs.dscsystems }}" \
            --arg dnp3py_version "$(arg adapters/dnp3py/Dockerfile UPSTREAM_VERSION)" \
            --arg dnp3py_sha "$(arg adapters/dnp3py/Dockerfile UPSTREAM_SHA)" \
            --arg dnp3py_digest "${{ steps.digests.outputs.dnp3py }}" \
            --arg dnp3c_version "$(arg conformance/dnp3c/Dockerfile DNP3C_VERSION)" \
            '{
              version: $version,
              commit: $commit,
              contract: $contract,
              fixtureSchema: $fixture,
              platforms: ["linux/amd64", "linux/arm64"],
              upstream: {
                opendnp3: { version: $odnp3_version, revision: $odnp3_sha },
                "dscsystems/go-dnp3": { version: $godnp3_version, revision: $godnp3_sha },
                dnp3py: { version: $dnp3py_version, revision: $dnp3py_sha }
              },
              images: {
                opendnp3: ("ghcr.io/otfabric/dnp3-interop-opendnp3@" + $opendnp3_digest),
                dscsystems: ("ghcr.io/otfabric/dnp3-interop-dscsystems@" + $dscsystems_digest),
                dnp3py: ("ghcr.io/otfabric/dnp3-interop-dnp3py@" + $dnp3py_digest)
              },
              localOnly: {
                stepfunc: {
                  note: "Not published: the licence of the Step Function I/O dnp3 crate forbids distributing it. Build the image locally from this tag; the build fetches the crate from crates.io under that licence.",
                  make: "make image-stepfunc VERSION=\($version)",
                  build: "docker build --build-arg ADAPTER_VERSION=\($version) -f adapters/stepfunc/Dockerfile -t ghcr.io/otfabric/dnp3-interop-stepfunc:\($version) .",
                  upstream: { "stepfunc/dnp3": { version: $sf_version, revision: $sf_sha } }
                },
                dnp3c: {
                  note: "Not published: the dnp3c runner (DNP3 IED Certification Procedure, GPL-3.0-only). Build the image locally from this tag; the build fetches dnp3c from Maven Central. See docs/CONFORMANCE.md.",
                  make: "make image-dnp3c VERSION=\($version)",
                  build: "docker build --build-arg ADAPTER_VERSION=\($version) -f conformance/dnp3c/Dockerfile -t ghcr.io/otfabric/dnp3-interop-dnp3c:\($version) .",
                  upstream: { "stepfunc/dnp3c": { version: $dnp3c_version, maven: "io.stepfunc:dnp3c" } }
                }
              }
            }' > manifest.json
          if jq -e '.images | has("stepfunc") or has("dnp3c")' manifest.json >/dev/null; then
            echo "::error::manifest.json lists a stepfunc or dnp3c image"; exit 1
          fi
          cat manifest.json
          sha256sum manifest.json > checksums.txt

      - name: Write the release body
        env:
          OPENDNP3: ${{ steps.digests.outputs.opendnp3 }}
          DSCSYSTEMS: ${{ steps.digests.outputs.dscsystems }}
          DNP3PY: ${{ steps.digests.outputs.dnp3py }}
        run: |
          {
            scripts/release-notes.sh "${VERSION}"
            echo
            echo "## Images"
            echo
            echo "| Image | Digest |"
            echo "|-------|--------|"
            echo "| \`${REGISTRY}/dnp3-interop-opendnp3:${VERSION}\` | \`${OPENDNP3}\` |"
            echo "| \`${REGISTRY}/dnp3-interop-dscsystems:${VERSION}\` | \`${DSCSYSTEMS}\` |"
            echo "| \`${REGISTRY}/dnp3-interop-dnp3py:${VERSION}\` | \`${DNP3PY}\` |"
            echo
            echo "The stepfunc image is not published, at Step Function I/O's request: the licence of their dnp3 crate forbids distributing it, and the image has the crate compiled in. Build it locally from this tag; the build fetches the crate from crates.io under that licence: \`make image-stepfunc VERSION=${VERSION}\`, or \`docker build --build-arg ADAPTER_VERSION=${VERSION} -f adapters/stepfunc/Dockerfile -t ${REGISTRY}/dnp3-interop-stepfunc:${VERSION} .\`"
            echo
            echo "The dnp3c runner (\`dnp3-interop-dnp3c\`, the DNP3 IED Certification Procedure as Step Function I/O's dnp3c implements it, GPL-3.0-only) is not published either: \`make image-dnp3c VERSION=${VERSION}\` builds it, fetching dnp3c from Maven Central. See \`docs/CONFORMANCE.md\`."
            echo
            echo "## Pinning in a consumer"
            echo
            echo '```bash'
            echo "DNP3_INTEROP_OPENDNP3_IMAGE=${REGISTRY}/dnp3-interop-opendnp3@${OPENDNP3}"
            echo "DNP3_INTEROP_DSCSYSTEMS_IMAGE=${REGISTRY}/dnp3-interop-dscsystems@${DSCSYSTEMS}"
            echo "DNP3_INTEROP_DNP3PY_IMAGE=${REGISTRY}/dnp3-interop-dnp3py@${DNP3PY}"
            echo "# built locally (see above), not pulled:"
            echo "DNP3_INTEROP_STEPFUNC_IMAGE=${REGISTRY}/dnp3-interop-stepfunc:${VERSION}"
            echo "DNP3_INTEROP_DNP3C_IMAGE=${REGISTRY}/dnp3-interop-dnp3c:${VERSION}"
            echo '```'
            echo
            echo "\`manifest.json\` records the upstream revisions these images were built from, and under \`localOnly\` the pins of the stepfunc and dnp3c images you build yourself. The published images contain MIT, Apache-2.0 and GPL-3.0-or-later software and are for interoperability testing. See \`THIRD_PARTY_NOTICES.md\`."
          } > "${RUNNER_TEMP}/release-body.md"
          cat "${RUNNER_TEMP}/release-body.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            manifest.json
            checksums.txt

  # Qualification of what was just published: the self-tests again against the
  # registry's images, a compatibility report, a vulnerability scan and SBOMs,
  # all attached to the release.
  qualify:
    name: Release qualification
    needs: [version, release]
    uses: ./.github/workflows/qualify.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      upload: true
