# SPDX-License-Identifier: MIT
#
# The Step Function I/O dnp3 adapter. The dnp3 crate is pinned exactly here
# and, with every other dependency, by Cargo.lock; versions.yaml mirrors the
# pin and scripts/check-versions.sh keeps them in step.

[package]
name = "dnp3-interop-stepfunc"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "dnp3-interop"
path = "src/main.rs"

[dependencies]
# TCP only: no TLS (ring) and no serial port support compiled in.
dnp3 = { version = "=1.7.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[profile.release]
strip = true
