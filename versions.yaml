# Machine-readable version manifest for dnp3-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles, adapters/{dnp3py,nfmdnp3}/requirements.txt and
# adapters/{dscsystems,cbsigma}/go.mod are the source of truth for a build: scripts/check-versions.sh fails when this
# file disagrees with them.

interop_version: "0.12.1"
contract_version: "1.5"        # docs/CONTAINER_CONTRACT.md; documents carry schemaVersion "1.0", the compatible line
fixture_schema: "1.0"          # fixtures/schema/dnp3-fixture.schema.json

protocol:
  name: "DNP3 (IEEE 1815)"
  default_port: 20000

implementations:
  opendnp3:
    priority: P0
    status: implemented
    upstream: "opendnp3"
    repository: "https://github.com/dnp3/opendnp3"
    version: "3.1.2"             # last release; the repository is archived (2022)
    revision: "26b4c01e4839bbbda8866655e086471c4917ee53"
    license: "Apache-2.0"
    language: "C++"
    independent_engine: true
    roles: [server, client]
    # Fetched by opendnp3's own CMake (deps/*.cmake) at configure time and
    # verified there against these SHA-1 hashes.
    dependencies:
      asio: "asio-1-16-0.zip SHA1 6BDD33522D5B95B36445ABB2072A481F7CE15402 (Boost Software License 1.0)"
      exe4cpp: "automatak/exe4cpp fb878a4de598ba9d6e4338afebf83f96e03af1b8 SHA1 18B141E8CF09DC8D28CC62DD5FA2920670D501BD (Apache-2.0)"
      ser4cpp: "automatak/ser4cpp 3c449734dc530a8f465eb0982de29165cc4e23d5 SHA1 937B759B7CC80180DA26B47037E796B59798A672 (Apache-2.0)"

  dnp3py:
    priority: P1
    status: implemented
    upstream: "dnp3py"
    repository: "https://github.com/craigpnnl/dnp3py"
    package: "dnp3py"
    version: "0.6.0"             # latest release (PyPI)
    revision: "c00d5df22e779df72f7caa4402c3f34957eb276d"
    license: "MIT"
    language: "Python"
    independent_engine: true
    roles: [server, client]
    note: >-
      The outstation serves only the dnp3py fixture: it cannot serve the
      baseline fixture (no double-bit inputs, octet strings or per-point
      variations).

  dscsystems:
    priority: P1
    status: implemented
    upstream: "DSC Systems go-dnp3"
    repository: "https://github.com/dscsystems/go-dnp3"
    module: "github.com/dscsystems/go-dnp3"
    version: "v0.8.2"            # latest release
    revision: "1fcec1d7881541d794fe257d2ede3ba46587b500"
    license: "GPL-3.0-or-later"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    note: "Experimental: the README says the API is not yet stable."

  cbsigma:
    priority: P1
    status: implemented
    upstream: "cB-Sigma dnp3"
    repository: "https://github.com/cB-Sigma/dnp3"
    module: "github.com/cB-Sigma/dnp3"
    version: "v0.3.1"            # latest release
    revision: "91f2f33c90e978e48bf67d20bca1022e769ed4d6"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    dependencies:
      iotsec: "github.com/cB-Sigma/iotsec v0.2.0 c84d6be103419e74e4598c2c24458f346f7718dd (Apache-2.0)"
      serial: "github.com/goburrow/serial v0.1.0 (MIT)"

  nfmdnp3:
    priority: P2
    status: implemented
    upstream: "nfm-dnp3"
    repository: "https://github.com/fxodell/dnp3py"
    package: "nfm-dnp3"          # PyPI; imported as dnp3py
    version: "1.0.1"             # latest release (PyPI)
    revision: "8d1dc7f50d319a8dbb90e1c3091754d6ab02d1a6"
    license: "MIT"               # declared in the package metadata; the repository has no LICENSE file
    language: "Python"
    independent_engine: true
    roles: [client]
    note: >-
      A master over TCP only. 1.0.1 has data link and application layer
      defects that break most exchanges with a confirming outstation; they
      are recorded in tests/known-bugs.tsv and reported upstream.

  tmw:
    priority: P2
    status: on-hold              # since 2026-10-20, by the owner's decision; nothing is built
    upstream: "Triangle MicroWorks DNP3 Source Code Library"
    repository: "proprietary; source supplied at build time"
    license: "commercial"
    language: "C"
    independent_engine: true

# OT Fabric's own stacks. Not independent implementations, not in a release of
# this repository or its manifest.json: see own/<library>/README.md.
own_implementations:
  otfabric:
    upstream: "go-dnp3"
    repository: "https://github.com/otfabric/go-dnp3"
    artifact: "go:github.com/otfabric/go-dnp3"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [server, client]
    image: "ghcr.io/otfabric/dnp3-interop-otfabric"
    build: "own/go-dnp3"

dependencies:
  nlohmann_json: "debian trixie nlohmann-json3-dev"   # opendnp3 adapter, MIT, header-only

# Debian packages of the debian:trixie-slim stages, installed from this
# snapshot of the Debian archive (snapshot.debian.org; the date the base image
# at its digest was built from) at these versions. The Dockerfiles pin them:
# scripts/check-versions.sh fails when a Dockerfile installs a package or
# names a snapshot that is not here. Move them with the base image digest.
debian_snapshot: "20261104T212339Z"
debian_packages:
  ca-certificates: "20250419+deb13u1"
  cmake: "3.31.6-2"
  g++: "4:14.2.0-1"
  git: "1:2.47.3-0+deb13u1"
  libssl-dev: "3.5.7-1~deb13u3"
  libssl3t64: "3.5.7-1~deb13u3"
  make: "4.4.1-2"
  nlohmann-json3-dev: "3.11.3-2.1"
  socat: "1.8.0.3-1+deb13u1"

base_images:
  # Digests recorded 2026-11-11; the Dockerfiles pin these by digest.
  debian_trixie_slim: "docker.io/library/debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2"
  python_3_14_10_slim_trixie: "docker.io/library/python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f"
  golang_1_27_4_trixie: "docker.io/library/golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9"

# The tooling of the Makefile and the workflows, pinned by version and digest
# (multi-arch indexes; the Makefile pulls the images through TOOLS_REGISTRY).
# scripts/check-versions.sh fails when the Makefile or scripts/qualify.sh
# names another. The Python packages are in scripts/requirements*.txt.
tooling:
  shellcheck: "koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d"
  hadolint: "hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d"
  python: "library/python:3.12.16-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"
  bats: "bats/bats:1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f"
  trivy: "ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb"
  govulncheck: "golang.org/x/vuln/cmd/govulncheck@v1.9.0"   # run with the golang image of the adapters
  gosec: "github.com/securego/gosec/v2/cmd/gosec@v2.30.0"   # run with the golang image of the adapters

# Test tools: not implementations, no adapter.
tools:
  dnp3c:
    upstream: "Step Function I/O dnp3c"
    repository: "https://github.com/stepfunc/dnp3c"
    maven: "io.stepfunc:dnp3c"
    version: "0.2.0"             # latest release (Maven Central, 2026-10-16)
    revision: "881209943b670cc59b16301346dffa7d5523ab72"   # tag 0.2.0
    license: "GPL-3.0-only"
    language: "Scala"
    published: false
    base_images:
      maven: "maven:3.9.12-eclipse-temurin-17-noble@sha256:a0603aab698040d9c94259f379ec0487da1678560748d6c7508483034033c53d"
      jre: "eclipse-temurin:17.0.20_8-jre-noble@sha256:39d618b8fda3408cfe792db2b666c0e3db8ea4ae263ab4d0c3805933e5355f45"
    note: >-
      The DNP Users Group's DNP3 IED Certification Procedure (3.1 rev 1,
      levels 1 to 3; 2.7, level 2). The runner in conformance/dnp3c/ is
      GPL-3.0-only, as it links dnp3c. The image is built locally
      (make image-dnp3c), fetching dnp3c from Maven Central; it is not
      published. See docs/CONFORMANCE.md.

images:
  opendnp3: "ghcr.io/otfabric/dnp3-interop-opendnp3"
  dscsystems: "ghcr.io/otfabric/dnp3-interop-dscsystems"
  dnp3py: "ghcr.io/otfabric/dnp3-interop-dnp3py"
  cbsigma: "ghcr.io/otfabric/dnp3-interop-cbsigma"
  nfmdnp3: "ghcr.io/otfabric/dnp3-interop-nfmdnp3"
  # Local tag only: not published (see tools.dnp3c).
  dnp3c: "ghcr.io/otfabric/dnp3-interop-dnp3c"

platforms:
  - "linux/amd64"
  - "linux/arm64"
