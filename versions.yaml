# Machine-readable version manifest for dnp3-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles, adapters/stepfunc/Cargo.toml (with Cargo.lock),
# adapters/dnp3py/requirements.txt and adapters/dscsystems/go.mod are the
# source of truth for a build: scripts/check-versions.sh fails when this file
# disagrees with them.

interop_version: "0.7.2"
contract_version: "1.4"        # docs/CONTAINER_CONTRACT.md; documents carry schemaVersion "1.0", the compatible line
fixture_schema: "1.0"          # fixtures/schema/dnp3-fixture.schema.json

protocol:
  name: "DNP3 (IEEE 1815)"
  default_port: 20000

implementations:
  stepfunc:
    priority: P0
    status: implemented
    upstream: "Step Function I/O dnp3"
    repository: "https://github.com/stepfunc/dnp3"
    crate: "dnp3"
    version: "1.8.0"             # latest release (crates.io, 2026-10-29)
    revision: "235533ae276cd8f33b669c6db395979a308ef848"   # tag 1.8.0
    license: "Step Function I/O non-commercial licence (LICENSE.txt of the crate)"
    language: "Rust"
    independent_engine: true
    roles: [server, client]
    published: false
    note: >-
      Non-commercial, non-production licence that forbids distributing the
      library (LICENSE.txt section 2.2). The image is not published, at Step
      Function I/O's request (#19): each user builds it locally
      (make image-stepfunc), getting the crate from crates.io under that
      licence. The images of v0.1.0 to v0.4.2 are withdrawn.

  opendnp3:
    priority: P0
    status: implemented
    upstream: "opendnp3"
    repository: "https://github.com/dnp3/opendnp3"
    version: "3.1.2"             # last release; the repository is archived (2022)
    revision: "26b4c01e4839bbbda8866655e086471c4917ee53"
    license: "Apache-2.0"
    language: "C++"
    independent_engine: true
    roles: [server, client]
    # Fetched by opendnp3's own CMake (deps/*.cmake) at configure time and
    # verified there against these SHA-1 hashes.
    dependencies:
      asio: "asio-1-16-0.zip SHA1 6BDD33522D5B95B36445ABB2072A481F7CE15402 (Boost Software License 1.0)"
      exe4cpp: "automatak/exe4cpp fb878a4de598ba9d6e4338afebf83f96e03af1b8 SHA1 18B141E8CF09DC8D28CC62DD5FA2920670D501BD (Apache-2.0)"
      ser4cpp: "automatak/ser4cpp 3c449734dc530a8f465eb0982de29165cc4e23d5 SHA1 937B759B7CC80180DA26B47037E796B59798A672 (Apache-2.0)"

  dnp3py:
    priority: P1
    status: implemented
    upstream: "dnp3py"
    repository: "https://github.com/craigpnnl/dnp3py"
    package: "dnp3py"
    version: "0.6.0"             # latest release (PyPI)
    revision: "c00d5df22e779df72f7caa4402c3f34957eb276d"
    license: "MIT"
    language: "Python"
    independent_engine: true
    roles: [server, client]
    note: >-
      The outstation serves only the dnp3py fixture: it cannot serve the
      baseline fixture (no double-bit inputs, octet strings or per-point
      variations).

  dscsystems:
    priority: P1
    status: implemented
    upstream: "DSC Systems go-dnp3"
    repository: "https://github.com/dscsystems/go-dnp3"
    module: "github.com/dscsystems/go-dnp3"
    version: "v0.8.2"            # latest release
    revision: "1fcec1d7881541d794fe257d2ede3ba46587b500"
    license: "GPL-3.0-or-later"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    note: "Experimental: the README says the API is not yet stable."

  tmw:
    priority: P2
    status: on-hold              # since 2026-10-20, by the owner's decision; nothing is built
    upstream: "Triangle MicroWorks DNP3 Source Code Library"
    repository: "proprietary; source supplied at build time"
    license: "commercial"
    language: "C"
    independent_engine: true

dependencies:
  nlohmann_json: "debian trixie nlohmann-json3-dev"   # opendnp3 adapter, MIT, header-only
  # stepfunc adapter: tokio, serde_json, tracing-subscriber at the versions in
  # adapters/stepfunc/Cargo.lock

base_images:
  # Digests recorded 2026-10-30; the Dockerfiles pin these by digest.
  debian_trixie_slim: "docker.io/library/debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4"
  python_3_14_8_slim_trixie: "docker.io/library/python:3.14.8-slim-trixie@sha256:fbecd461fc72d21b2143c6eaba25143738079154a6d0ea3da3aec724f50eed4a"
  golang_1_27_2_trixie: "docker.io/library/golang:1.27.2-trixie@sha256:47667934874913a449b96faa7ef4777fa285d9ec29126ee80ed61c45b7cccf0e"
  rust_1_99_1_slim_trixie: "docker.io/library/rust:1.99.1-slim-trixie@sha256:b8e062b1c3a80183df83d9ba187cadd2b5ab84bc78d453dbfeb2fccd5f982247"

# Test tools: not implementations, no adapter.
tools:
  dnp3c:
    upstream: "Step Function I/O dnp3c"
    repository: "https://github.com/stepfunc/dnp3c"
    maven: "io.stepfunc:dnp3c"
    version: "0.2.0"             # latest release (Maven Central, 2026-10-16)
    revision: "881209943b670cc59b16301346dffa7d5523ab72"   # tag 0.2.0
    license: "GPL-3.0-only"
    language: "Scala"
    published: false
    base_images:
      maven: "maven:3.9.12-eclipse-temurin-17-noble@sha256:a0603aab698040d9c94259f379ec0487da1678560748d6c7508483034033c53d"
      jre: "eclipse-temurin:17.0.20_8-jre-noble@sha256:39d618b8fda3408cfe792db2b666c0e3db8ea4ae263ab4d0c3805933e5355f45"
    note: >-
      The DNP Users Group's DNP3 IED Certification Procedure (3.1 rev 1,
      levels 1 to 3; 2.7, level 2). The runner in conformance/dnp3c/ is
      GPL-3.0-only, as it links dnp3c. The image is built locally
      (make image-dnp3c), fetching dnp3c from Maven Central; it is not
      published. See docs/CONFORMANCE.md.

images:
  # Local tag only: never pushed or pulled (see implementations.stepfunc).
  stepfunc: "ghcr.io/otfabric/dnp3-interop-stepfunc"
  opendnp3: "ghcr.io/otfabric/dnp3-interop-opendnp3"
  dscsystems: "ghcr.io/otfabric/dnp3-interop-dscsystems"
  dnp3py: "ghcr.io/otfabric/dnp3-interop-dnp3py"
  # Local tag only: not published (see tools.dnp3c).
  dnp3c: "ghcr.io/otfabric/dnp3-interop-dnp3c"

platforms:
  - "linux/amd64"
  - "linux/arm64"
